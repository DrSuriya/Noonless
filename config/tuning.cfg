; Tuning values for the horror maze prototype.
;
; Every undecided number and rule lives here, never in code. Starting values
; come from docs/design.pdf Section 6.5 unless a comment says otherwise. Each
; comment names the decision the value stands in for. docs/decisions.md
; overrides the PDF: when a decision is made there, update the value and its
; comment here.
;
; Units are in the key names. "percent_of_max" means percent of the maximum
; bar. Values are read at startup by scripts/tuning.gd; a missing key is an
; error, not a silent default.

[trigger]

; Collapse gaze hold: 1.0 s. DECIDED (Chat 3, Sections 2.4 and 2.5): during a
; collapse the player looks at a dead end for one second to escape. Not an
; open value; change it only if docs/decisions.md says so.
collapse_hold_seconds=1.0

; Normal-play trigger hold: 0.3 s. Placeholder for D3 (is the normal-play
; trigger instant or held?).
normal_hold_seconds=0.3

; Trigger distance: within 2 m of the dead-end wall. Placeholder, no decision
; ID. Together with facing_angle_deg it approximates the DECIDED sight-based
; trigger (Section 2.4), as in the Section 6.4 trigger check.
distance_m=2.0

; Trigger facing angle: within 30 degrees of facing the wall. Placeholder, no
; decision ID. See distance_m. Measured on the full look direction, so
; looking up or down counts (docs/decisions.md, 2026-11-03).
facing_angle_deg=30.0

[swap]

; Landing spots per base map: 6 (3 per origin map). CHECK, placeholder for
; D16 (confirm the landing-spot reading). Stored per origin map; with the
; prototype's two maps each map has one origin map, so 3 landing spots.
; They're one-cell alcoves in the half of the map farther from the objective,
; kept apart (placement: docs/decisions.md, 2026-09-27).
landing_spots_per_origin_map=3

; Grace period: 10 s. Chat 1 value; Chat 3 didn't specify. OPEN in
; Section 2.5 ("Grace period details"), which has no decision ID. Starts on
; every swap. Until monsters exist (Stage 6) it's only a timer in the debug
; view.
grace_period_seconds=10.0

; NOT FROM THE DESIGN. How many panels the blended wall at a landing spot has.
; They step across the alcove's back wall from the origin map's color to this
; map's color (panels across the back wall: docs/decisions.md, 2026-11-03).
blended_wall_panels=4

[collapse]

; Escape toll: 1% of max per second of rushing, cap 50%. Chat 1 value,
; placeholder for D5 (size and form of the escape toll). Section 6.5 note:
; rushes will run long now that dead ends move far from the objective, so
; expect to lower this.
toll_percent_of_max_per_rush_second=1.0
toll_cap_percent_of_max=50.0

; Rush speed boost: +25%. Placeholder, no decision ID. (The boost itself is
; DECIDED in Section 2.5; its size is not.)
rush_speed_boost_percent=25.0

[objective]

; NOT FROM THE DESIGN. How close the player must stand to the objective to
; activate it with E, in metres.
activate_distance_m=2.0

[bar]

; The bar is the fill-and-ceiling IDEA from Section 2.6, built to be tested
; as Section 6.2 describes.

; Bar regeneration: refills to the ceiling in about 60 s at rest.
; Placeholder, no decision ID.
regen_seconds_to_ceiling=60.0

; Sprint drain: empties a full bar in about 15 s. Placeholder, no decision
; ID. Whether sprinting alone can take the bar to zero is D17, which has no
; Section 6.5 value.
sprint_seconds_to_empty_full_bar=15.0

; Placeholder for D17 (can sprinting alone kill?), using Section 5's
; suggested lean: sprinting stops at a floor instead of killing. NOT FROM
; THE DESIGN: the floor's height. When the fill reaches it, sprinting stops
; until the sprint key is released and pressed again.
sprint_floor_percent_of_max=10.0

; Monster hit: -25% fill; heavy hits also -10% ceiling. Placeholder, no
; decision ID.
monster_hit_fill_loss_percent=25.0
heavy_hit_extra_ceiling_loss_percent=10.0

[items]

; Bandage: +10% ceiling. Placeholder, no decision ID.
bandage_ceiling_gain_percent=10.0

; Hospital kit: +40% ceiling and a full refill. Placeholder, no decision ID.
hospital_kit_ceiling_gain_percent=40.0
hospital_kit_full_refill=true

; NOT FROM THE DESIGN. Pickups per map, how far apart they lie (in cells),
; and how close the player must come to pick one up. Containers are left out
; of the prototype, so items lie in the open, never in a dead-end branch.
bandages_per_map=3
hospital_kits_per_map=1
item_spacing_cells=4
pickup_radius_m=1.0

[inventory]

; Starting inventory: 3 slots. Placeholder for D11 (starting inventory size).
starting_slots=3

[maze]

; Prototype maze size: 20 x 20 cells per map. Placeholder, no decision ID.
width_cells=20
height_cells=20

; Minimum dead-end branch length: 3 cells. Placeholder, no decision ID.
; (The long walk itself is DECIDED in Section 2.4.) Kept at 3 after Stage 2
; showed it leaves about 4 dead ends per map (docs/decisions.md, 2026-11-03).
min_dead_end_branch_cells=3

; Dead-end survival chance when braiding: 80% near the objective, 20% far
; away. Placeholder, no decision ID. Scales linearly with straight-line
; distance from the objective, from the nearest to the farthest cell
; (docs/decisions.md, 2026-09-27).
dead_end_survival_near_objective_percent=80.0
dead_end_survival_far_percent=20.0

; NOT FROM THE DESIGN. The fewest dead ends a layout may have, normal or
; collapse. Without it, about 1 map in 80 had none, so it could never be left
; by a dead end (or its collapse never escaped). Braiding is retried from the
; same seed until the layout has at least this many.
min_dead_ends_per_layout=2

; Rooms per map: 6 to 8, each 2 to 3 cells on a side. Placeholder, no
; decision ID; the range is your Stage 2 choice (docs/decisions.md,
; 2026-09-27).
room_count_min=6
room_count_max=8
room_size_min_cells=2
room_size_max_cells=3

; Environmental tells (Section 2.4 DECIDED; Section 6.2 lists "simple
; dead-end tells, such as darker floors or dimmer light"). NOT FROM THE
; DESIGN: how they look. The floor of a dead-end branch darkens step by step,
; from tell_darken_entry at its first cell to tell_darken_tip at the end wall
; (fractions: 0 is the normal floor, 1 is black).
tell_darken_entry=0.1
tell_darken_tip=0.4

; NOT FROM THE DESIGN. Picked for Stage 2: the size of one grid cell (so the
; corridor width), the wall height and the wall thickness, in metres.
cell_size_m=3.0
wall_height_m=3.0
wall_thickness_m=0.2

[maps]

; NOT FROM THE DESIGN. Section 6.2 asks for one flat color per map; these
; are the colors, picked for Stage 2. Map A is gray-blue, map B sandy brown.
map_a_color=Color(0.45, 0.52, 0.62, 1)
map_b_color=Color(0.72, 0.6, 0.42, 1)

[monsters]

; Sensitivity multiplier: x1.0 / x1.25 / x1.5 with 3 / 2 / 1 maps active.
; Placeholder, no decision ID.
sensitivity_multiplier_3_maps_active=1.0
sensitivity_multiplier_2_maps_active=1.25
sensitivity_multiplier_1_map_active=1.5

; Bleed-over: about 25% of a removed map's monsters. Placeholder, no
; decision ID. Not used yet: with two maps, a run ends at the first escape.
bleed_over_percent_of_removed_map_monsters=25.0

; Everything below in [monsters] is NOT FROM THE DESIGN. The prototype has
; one sight-based chaser (Section 6.2); these numbers make it work.

; How many per map, and how far (in cells, straight-line) their spawn cells
; must be from the start and from landing spots. They never spawn in a
; dead-end branch (no ambush at dead ends, Section 2.4).
monsters_per_map=2
spawn_min_distance_cells=6

; Speeds in metres per second. Chasing is faster than walking (3.0) and
; slower than sprinting (5.5), so a chase is escaped by sprinting to a dead
; end before the bar runs low.
patrol_speed_mps=1.4
suspicious_speed_mps=2.0
chase_speed_mps=4.2

; Sight: a cone this many degrees either side of where the monster faces,
; out to this range, blocked by walls. The range is multiplied by the
; sensitivity multiplier above, and by crouch_sight_factor when the player
; crouches (D6's lean: crouching makes you harder to spot).
sight_half_angle_deg=55.0
sight_range_m=14.0
crouch_sight_factor=0.6

; A suspicious monster starts chasing once it has seen the player for this
; long, or at once if the player is within close_range_m.
notice_seconds=0.75
close_range_m=5.0

; After losing sight, a chasing monster keeps heading for the last place it
; saw the player, then searches around there for this long before
; returning to its patrol.
search_seconds=6.0

; Hits: within attack_range_m, at most once per attack_cooldown_seconds,
; and the monster stops for hit_pause_seconds after each hit. Hits during a
; collapse are heavy (they also lower the ceiling).
attack_range_m=1.2
attack_cooldown_seconds=1.5
hit_pause_seconds=0.8

[playtest]

; Section 6.6 logs "swaps within a few seconds of entering a dead-end branch
; with no chase" as a proxy for accidental swaps. "A few seconds" is this
; window. Placeholder, no decision ID.
quick_swap_window_seconds=5.0

; NOT FROM THE DESIGN. Set to false for playtests run from the editor:
; turns off the debug overlay (Tab, and with it the seed field) and the
; swap-now key (N), so testers can't press them by accident and skew the
; metrics. Exported release builds are playtest builds and always have them
; off.
debug_keys_enabled=true

[player]

; NOT FROM THE DESIGN. No Section 6.5 row and no decision ID covers these.
; Picked for the Stage 1 engine spike so there is something to walk with.
; Stage 4 (walk, sprint and crouch) will revisit movement.

; Walking speed in metres per second.
walk_speed_mps=3.0

; Sprinting and crouching speeds in metres per second. Sprint is faster than
; the monster's chase speed (Stage 6) so a chase can be outrun for a while.
; Crouching is slower (D6's suggested lean: quieter, slower and harder to
; spot, with no extra drain); the speed itself is not from the design.
sprint_speed_mps=5.5
crouch_speed_mps=1.5

; Eye height while crouching, in metres (standing is 1.6 m, set in
; scenes/player.tscn).
crouch_eye_height_m=1.0

; Mouse look: degrees of turn per pixel of mouse movement.
mouse_sensitivity_deg_per_px=0.12
