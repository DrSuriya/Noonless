; Tuning values for the horror maze prototype.
;
; Every undecided number and rule lives here, never in code. Starting values
; come from docs/design.pdf Section 6.5 unless a comment says otherwise. Each
; comment names the decision the value stands in for. docs/decisions.md
; overrides the PDF: when a decision is made there, update the value and its
; comment here.
;
; Units are in the key names. "percent_of_max" means percent of the maximum
; bar. Values are read at startup by scripts/tuning.gd; a missing key is an
; error, not a silent default.

[trigger]

; Collapse gaze hold: 1.0 s. DECIDED (Chat 3, Sections 2.4 and 2.5): during a
; collapse the player looks at a dead end for one second to escape. Not an
; open value; change it only if docs/decisions.md says so.
collapse_hold_seconds=1.0

; Normal-play trigger hold: 0.3 s. Placeholder for D3 (is the normal-play
; trigger instant or held?).
normal_hold_seconds=0.3

; Trigger distance: within 2 m of the dead-end wall. Placeholder, no decision
; ID. Together with facing_angle_deg it approximates the DECIDED sight-based
; trigger (Section 2.4), as in the Section 6.4 trigger check.
distance_m=2.0

; Trigger facing angle: within 30 degrees of facing the wall. Placeholder, no
; decision ID. See distance_m.
facing_angle_deg=30.0

[swap]

; Landing spots per base map: 6 (3 per origin map). CHECK, placeholder for
; D16 (confirm the landing-spot reading). Stored per origin map; with the
; prototype's two maps each map has one origin map, so 3 landing spots.
landing_spots_per_origin_map=3

; Grace period: 10 s. Chat 1 value; Chat 3 didn't specify. OPEN in
; Section 2.5 ("Grace period details"), which has no decision ID.
grace_period_seconds=10.0

[collapse]

; Escape toll: 1% of max per second of rushing, cap 50%. Chat 1 value,
; placeholder for D5 (size and form of the escape toll). Section 6.5 note:
; rushes will run long now that dead ends move far from the objective, so
; expect to lower this.
toll_percent_of_max_per_rush_second=1.0
toll_cap_percent_of_max=50.0

; Rush speed boost: +25%. Placeholder, no decision ID. (The boost itself is
; DECIDED in Section 2.5; its size is not.)
rush_speed_boost_percent=25.0

[bar]

; The bar is the fill-and-ceiling IDEA from Section 2.6, built to be tested
; as Section 6.2 describes.

; Bar regeneration: refills to the ceiling in about 60 s at rest.
; Placeholder, no decision ID.
regen_seconds_to_ceiling=60.0

; Sprint drain: empties a full bar in about 15 s. Placeholder, no decision
; ID. Whether sprinting alone can take the bar to zero is D17, which has no
; Section 6.5 value.
sprint_seconds_to_empty_full_bar=15.0

; Monster hit: -25% fill; heavy hits also -10% ceiling. Placeholder, no
; decision ID.
monster_hit_fill_loss_percent=25.0
heavy_hit_extra_ceiling_loss_percent=10.0

[items]

; Bandage: +10% ceiling. Placeholder, no decision ID.
bandage_ceiling_gain_percent=10.0

; Hospital kit: +40% ceiling and a full refill. Placeholder, no decision ID.
hospital_kit_ceiling_gain_percent=40.0
hospital_kit_full_refill=true

[inventory]

; Starting inventory: 3 slots. Placeholder for D11 (starting inventory size).
starting_slots=3

[maze]

; Prototype maze size: 20 x 20 cells per map. Placeholder, no decision ID.
width_cells=20
height_cells=20

; Minimum dead-end branch length: 3 cells. Placeholder, no decision ID.
; (The long walk itself is DECIDED in Section 2.4.)
min_dead_end_branch_cells=3

; Dead-end survival chance when braiding: 80% near the objective, 20% far
; away. Placeholder, no decision ID.
dead_end_survival_near_objective_percent=80.0
dead_end_survival_far_percent=20.0

[monsters]

; Sensitivity multiplier: x1.0 / x1.25 / x1.5 with 3 / 2 / 1 maps active.
; Placeholder, no decision ID.
sensitivity_multiplier_3_maps_active=1.0
sensitivity_multiplier_2_maps_active=1.25
sensitivity_multiplier_1_map_active=1.5

; Bleed-over: about 25% of a removed map's monsters. Placeholder, no
; decision ID.
bleed_over_percent_of_removed_map_monsters=25.0

[player]

; NOT FROM THE DESIGN. No Section 6.5 row and no decision ID covers these.
; Picked for the Stage 1 engine spike so there is something to walk with.
; Stage 4 (walk, sprint and crouch) will revisit movement.

; Walking speed in metres per second.
walk_speed_mps=3.0

; Mouse look: degrees of turn per pixel of mouse movement.
mouse_sensitivity_deg_per_px=0.12
